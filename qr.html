<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معلومات النشاط</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f4c81, #1b6ca8, #3282b8);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            display: none;
            color: #333;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .description {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 25px;
            line-height: 1.6;
            padding: 0 10px;
            font-weight: 600;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .btn-link span {
            flex: 1;
            text-align: center;
        }

        .btn-link img, .btn-link svg {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .footer {
            font-size: 12px;
            color: #718096;
            border-top: 1px solid rgba(0,0,0,0.08);
            padding-top: 15px;
            margin-top: 10px;
            font-weight: 600;
        }

        #loading {
            font-size: 18px;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="loading">جاري التحميل...</div>

    <div class="card" id="profileCard">
        <div class="logo-container" id="logoBox" style="display: none;">
            <img id="clientLogo" src="" alt="شعار النشاط">
        </div>
        
        <h1 id="clientName"></h1>
        <p class="description" id="clientDesc"></p>

        <div class="links-container" id="linksContainer"></div>

        <div class="footer" id="clientFooter">جميع الحقوق محفوظة ✓</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaDAXHBPfJUr2quRe_8OyhEDqGrHaneNmcc",
            authDomain: "qr-system-45702.firebaseapp.com",
            databaseURL: "https://qr-system-45702-default-rtdb.firebaseio.com",
            projectId: "qr-system-45702",
            storageBucket: "qr-system-45702.firebasestorage.app",
            messagingSenderId: "983573164670",
            appId: "1:983573164670:web:4b352977dd6085b0649e2f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get("id");

        if (!customerId) {
            document.getElementById("loading").textContent = "معرف العميل غير موجود في الرابط!";
        } else {
            db.ref("customers/" + customerId).once("value").then(snapshot => {
                const data = snapshot.val();

                if (!data) {
                    document.getElementById("loading").textContent = "عذراً، بيانات هذا العميل غير موجودة.";
                    return;
                }

                if (data.redirectUrl && data.redirectUrl.trim() !== "") {
                    window.location.replace(data.redirectUrl.trim());
                    return;
                }

                document.getElementById("loading").style.display = "none";
                document.getElementById("profileCard").style.display = "block";

                if (data.name) {
                    document.getElementById("clientName").textContent = data.name;
                    document.title = data.name;
                } else {
                    document.getElementById("clientName").style.display = "none";
                }

                if (data.description) {
                    document.getElementById("clientDesc").textContent = data.description;
                    document.getElementById("clientDesc").style.display = "block";
                } else {
                    document.getElementById("clientDesc").style.display = "none";
                }

                if (data.logo) {
                    document.getElementById("clientLogo").src = data.logo;
                    document.getElementById("logoBox").style.display = "flex";
                }

                const linksContainer = document.getElementById("linksContainer");
                linksContainer.innerHTML = "";

                const addLinkButton = (url, text, iconHtml) => {
                    if (!url) return;
                    const a = document.createElement("a");
                    a.href = url;
                    a.className = "btn-link";
                    a.target = "_blank";
                    a.innerHTML = iconHtml + "<span>" + text + "</span><span style='width:24px;'></span>";
                    linksContainer.appendChild(a);
                };

                const phoneSvg = '<svg fill="#0ea5e9" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';
                const waSvg = '<svg fill="#25d366" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>';
                const fbSvg = '<svg fill="#1877f2" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>';
                const instaSvg = '<svg fill="#e1306c" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>';
                const webSvg = '<svg viewBox="0 0 36 36" style="width:24px;height:24px;"><path fill="#4285F4" d="M35.2 18.3c0-.1-.1-.7-.1-1.3H18v6.8h9.8c-.4 2.2-1.7 4.1-3.6 5.4v4.5h5.9c3.5-3.2 5.9-8 5.9-13.6z"/><path fill="#34A853" d="M18 35.5c4.9 0 9-1.6 12-4.3l-5.9-4.5c-1.7 1.1-3.8 1.8-6.1 1.8-4.7 0-8.7-3.2-10.1-7.5H1.8v4.6c3 6 9.2 10.1 16.2 10.1z"/><path fill="#FBBC05" d="M7.9 21c-.4-1.1-.6-2.4-.6-3.7s.2-2.6.6-3.7V9H1.8C.7 11.2 0 13.8 0 16.5s.7 5.3 1.8 7.5L7.9 21z"/><path fill="#EA4335" d="M18 7.3c2.7 0 5.1.9 7 2.6l5.2-5.2C27 2 22.9 0 18 0 11 0 4.8 4.1 1.8 10.1l6.1 4.6c1.4-4.3 5.4-7.4 10.1-7.4z"/></svg>';
                const vodafoneSvg = '<svg viewBox="0 0 24 24" style="width:24px;height:24px;"><path fill="#e60000" d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 3.6c4.639 0 8.4 3.761 8.4 8.4 0 2.231-.86 4.256-2.256 5.766l-.144.148C16.924 19.102 14.57 20 12 20c-4.639 0-8.4-3.761-8.4-8.4s3.761-8.4 8.4-8.4zm0 2.4c-3.314 0-6 2.686-6 6s2.686 6 6 6c1.594 0 3.045-.619 4.125-1.625l.135-.135C17.236 15.34 18 13.738 18 12c0-3.314-2.686-6-6-6z"/></svg>';

                addLinkButton(data.phone ? "tel:" + data.phone : "", "اتصال هاتفي", phoneSvg);
                addLinkButton(data.whatsapp ? "https://wa.me/" + data.whatsapp : "", "مراسلة واتساب", waSvg);
                addLinkButton(data.facebook, "فيسبوك", fbSvg);
                addLinkButton(data.instagram, "انستجرام", instaSvg);
                addLinkButton(data.website, "الموقع الإلكتروني / التقييم", webSvg);
                addLinkButton(data.instapay, "تحويل InstaPay", vodafoneSvg);
                addLinkButton(data.vodafonecash, "فودافون كاش", vodafoneSvg);

                if (data.footer !== undefined) {
                    document.getElementById("clientFooter").textContent = data.footer.trim() === "" ? "جميع الحقوق محفوظة ✓" : data.footer;
                }
            }).catch(err => {
                document.getElementById("loading").textContent = "حدث خطأ أثناء تحميل البيانات.";
            });
        }
    </script>
</body>
</html>
