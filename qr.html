<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:url("assets/background.jpg") center center/cover no-repeat;
background-attachment:fixed;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:500px;
text-align:center;
}

/* 🎯 تعديل إطار اللوجو ليكون بنفس خامة ولون أزرار الأيقونات بالضبط */
.logo-container{
width: 100%;
height: 200px;
border-radius: 18px;
margin: 20px auto;
overflow: hidden;
position: relative;
background: url("assets/card-bg.jpg") center center/cover;
box-shadow: 0 6px 15px rgba(0,0,0,.25);
display: flex;
align-items: center;
justify-content: center;
padding: 15px;
}

/* الطبقة الشفافة البيضاء بنفس درجة الأزرار */
.logo-container::before{
content: "";
position: absolute;
inset: 0;
background: rgba(255,255,255,.75);
z-index: 1;
}

/* صورة اللوجو نفسها فوق الطبقة الشفافة */
.logo-container img{
max-width: 100%;
max-height: 100%;
object-fit: contain;
position: relative;
z-index: 2;
display: block;
}

#name{
color:#fff;
font-size:34px;
margin-bottom:5px;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}

#description{
color:#fff;
font-size:18px;
margin-bottom:30px;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}


.btn{
display:flex;
align-items:center;
justify-content:center;
padding:18px 20px;
margin-bottom:15px;
border-radius:18px;
text-decoration:none;
color:#111;
font-size:20px;
font-weight:bold;
position:relative;
overflow:hidden;
background:url("assets/card-bg.jpg");
background-size:cover;
background-position:center;
box-shadow:0 6px 15px rgba(0,0,0,.25);
}


.btn::before{
content:"";
position:absolute;
inset:0;
background:rgba(255,255,255,.75);
}


.btn span{
position:relative;
z-index:2;
}


.btn i,
.btn img{
position:absolute;
right:20px;
z-index:2;
}


.btn i{
font-size:34px;
}


.whatsapp-icon{
color:#25D366;
}

.facebook-icon{
color:#1877F2;
}

.instagram-icon{
color:#E4405F;
}

.website-icon{
color:#444;
}


.custom-icon{
width:38px;
height:38px;
object-fit:contain;
}


.footer{
margin-top:20px;
color:#fff;
font-size:15px;
font-weight:bold;
}

</style>

</head>


<body>


<div class="card">

<!-- برواز اللوجو بخامة وتصميم الأزرار -->
<div id="logoWrapper" class="logo-container" style="display:none;">
    <img id="logo">
</div>


<h1 id="name"></h1>

<p id="description"></p>



<a id="whatsapp" class="btn" target="_blank">
<i class="fab fa-whatsapp whatsapp-icon"></i>
<span>WhatsApp</span>
</a>


<a id="facebook" class="btn" target="_blank">
<i class="fab fa-facebook facebook-icon"></i>
<span>Facebook</span>
</a>


<a id="instagram" class="btn" target="_blank">
<i class="fab fa-instagram instagram-icon"></i>
<span>Instagram</span>
</a>


<a id="website" class="btn" target="_blank">
<i class="fas fa-globe website-icon"></i>
<span>Website</span>
</a>



<a id="instapay" class="btn" target="_blank">
<img src="assets/instapay.png" class="custom-icon">
<span>InstaPay</span>
</a>



<a id="vodafonecash" class="btn" target="_blank">
<img src="assets/vodafonecash.png" class="custom-icon">
<span>Vodafone Cash</span>
</a>



<div class="footer">
QR Business Card
</div>


</div>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>


const firebaseConfig = {

apiKey: "AIzaDAXHBPfJUr2quRe_8OyhEDqGrHaneNmcc",

authDomain: "qr-system-45702.firebaseapp.com",

databaseURL: "https://qr-system-45702-default-rtdb.firebaseio.com",

projectId: "qr-system-45702",

storageBucket: "qr-system-45702.firebasestorage.app",

messagingSenderId: "983573164670",

appId: "1:983573164670:web:4b352977dd6085b0649e2f"

};


firebase.initializeApp(firebaseConfig);


const db = firebase.database();


const params = new URLSearchParams(window.location.search);

const id = params.get("id");



db.ref("customers/" + id).once("value")

.then(function(snapshot){


const data = snapshot.val();



if(!data){

document.querySelector(".card").innerHTML =
"<h2 style='color:white'>العميل غير موجود</h2>";

return;

}


// معالجة عرض إطار اللوجو بأسلوب الأزرار
const logoElem = document.getElementById("logo");
const logoWrapper = document.getElementById("logoWrapper");

if (data.logo && data.logo.trim() !== "") {
    logoElem.src = data.logo;
    logoWrapper.style.display = "flex";
} else {
    logoWrapper.style.display = "none";
}


document.getElementById("name").textContent =
data.name || "";


document.getElementById("description").textContent =
data.description || "";



document.getElementById("whatsapp").href =
data.whatsapp || "#";


document.getElementById("facebook").href =
data.facebook || "#";


document.getElementById("instagram").href =
data.instagram || "#";


document.getElementById("website").href =
data.website || "#";


document.getElementById("instapay").href =
data.instapay || "#";


document.getElementById("vodafonecash").href =
data.vodafonecash || "#";




// إخفاء الروابط الفاضية

if(!data.whatsapp)
document.getElementById("whatsapp").style.display="none";


if(!data.facebook)
document.getElementById("facebook").style.display="none";


if(!data.instagram)
document.getElementById("instagram").style.display="none";


if(!data.website)
document.getElementById("website").style.display="none";


if(!data.instapay)
document.getElementById("instapay").style.display="none";


if(!data.vodafonecash)
document.getElementById("vodafonecash").style.display="none";


});


</script>


</body>
</html>
