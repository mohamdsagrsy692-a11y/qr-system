<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>إدارة QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:30px;
}

.card{
background:white;
max-width:450px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px #ccc;
}

input, textarea{
width:90%;
padding:12px;
margin:8px;
border-radius:10px;
border:1px solid #ccc;
font-size:15px;
}

textarea{
height:80px;
}

button{
background:#111;
color:white;
padding:15px;
width:90%;
border:0;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
opacity:.8;
}

#qrcode{
margin:20px auto;
}

#download{
display:none;
}

</style>

</head>


<body>


<div id="login" class="card">

<h2>دخول الإدارة</h2>

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">
دخول
</button>

</div>




<div id="panel" class="card" style="display:none">


<h2>إضافة QR جديد</h2>


<input id="id" placeholder="رقم العميل مثال: 003">

<input id="name" placeholder="اسم النشاط">

<textarea id="description" placeholder="وصف النشاط"></textarea>

<input id="logo" placeholder="رابط اللوجو">

<input id="whatsapp" placeholder="رابط واتساب">

<input id="facebook" placeholder="رابط فيسبوك">

<input id="instagram" placeholder="رابط إنستجرام">

<input id="website" placeholder="رابط الموقع">

<input id="payment" placeholder="رابط الدفع">


<button onclick="createJSON()">
إنشاء ملف JSON
</button>


<hr>


<h3>إنشاء QR Code</h3>

<div id="qrcode"></div>

<p id="qrLink"></p>


<button onclick="createQR()">
إنشاء QR
</button>


<button id="download" onclick="downloadQR()">
تحميل QR PNG
</button>


</div>





<script>


let qrImage;



function login(){

let pass=document.getElementById("password").value;


if(pass==="CODE010951"){

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

}

else{

alert("كلمة المرور غير صحيحة");

}

}





function createJSON(){


let number=document.getElementById("id").value;


let data={

"name":name.value,

"description":description.value,

"logo":logo.value,

"whatsapp":whatsapp.value,

"facebook":facebook.value,

"instagram":instagram.value,

"website":website.value,

"payment":payment.value

};



let file=new Blob(

[JSON.stringify(data,null,2)],

{type:"application/json"}

);


let link=document.createElement("a");

link.href=URL.createObjectURL(file);

link.download=number+".json";

link.click();


}







function createQR(){


let id=document.getElementById("id").value;


if(id===""){

alert("اكتب رقم العميل أولاً");

return;

}



let url=
"https://mohamdsagrsy692-a11y.github.io/qr-system/qr.html?id="
+id;



document.getElementById("qrLink").innerHTML=url;


document.getElementById("qrcode").innerHTML="";



new QRCode(

document.getElementById("qrcode"),

{

text:url,

width:250,

height:250,

correctLevel:QRCode.CorrectLevel.H

}

);



setTimeout(()=>{

qrImage=document.querySelector("#qrcode img");

document.getElementById("download").style.display="block";

},500);



}





function downloadQR(){


if(!qrImage){

return;

}


let link=document.createElement("a");

link.href=qrImage.src;

link.download="QR-Code.png";

link.click();


}



</script>


</body>

</html>
