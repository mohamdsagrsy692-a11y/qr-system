<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>إدارة QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:30px;
}

.card{
background:white;
max-width:450px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px #ccc;
}

input,textarea{
width:90%;
padding:12px;
margin:8px;
border-radius:10px;
border:1px solid #ccc;
}

textarea{
height:80px;
}

button{
background:#111;
color:white;
padding:15px;
width:90%;
border:0;
border-radius:10px;
margin-top:10px;
cursor:pointer;
}

#qrcode{
margin:20px auto;
}

#customerList button{
background:#444;
margin:5px;
}

</style>

</head>

<body>


<div id="login" class="card">

<h2>دخول الإدارة</h2>

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">
دخول
</button>

</div>



<div id="panel" class="card" style="display:none">


<h2>إدارة العملاء</h2>


<input id="searchId" placeholder="رقم العميل مثال 001">

<button onclick="loadCustomer()">
تحميل بيانات العميل
</button>


<h3>قائمة العملاء</h3>

<div id="customerList"></div>



<input id="id" readonly>

<input id="name" placeholder="اسم النشاط">

<textarea id="description" placeholder="وصف النشاط"></textarea>


<input id="logo" placeholder="رابط اللوجو">

<input id="whatsapp" placeholder="واتساب">

<input id="facebook" placeholder="فيسبوك">

<input id="instagram" placeholder="انستجرام">

<input id="website" placeholder="الموقع">

<input id="payment" placeholder="الدفع">


<button onclick="saveCustomer()">
حفظ العميل
</button>


<button onclick="createQR()">
إنشاء QR
</button>


<div id="qrcode"></div>

<p id="qrLink"></p>


<button onclick="downloadQR()">
تحميل QR PNG
</button>


</div>

 <script>

const firebaseConfig = {

apiKey: "AIzaSyDAXHBPfJUr2quRe_8OyhEDqGrHaneNmcc",

authDomain: "qr-system-45702.firebaseapp.com",

databaseURL: "https://qr-system-45702-default-rtdb.firebaseio.com",

projectId: "qr-system-45702",

storageBucket: "qr-system-45702.firebasestorage.app",

messagingSenderId: "983573164670",

appId: "1:983573164670:web:4b352977dd6085b0649e2f"

};


firebase.initializeApp(firebaseConfig);


const db = firebase.database();


let qrImage;



function login(){

let pass=document.getElementById("password").value;


if(pass==="CODE010951"){

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

generateNumber();

loadCustomers();

}

else{

alert("كلمة المرور غير صحيحة");

}

}





function generateNumber(){

let n=localStorage.getItem("qrNumber") || 1;

document.getElementById("id").value=
String(n).padStart(3,"0");

}





function loadCustomers(){


db.ref("customers").once("value")

.then(function(snapshot){


let list="";


snapshot.forEach(function(child){


let id=child.key;

let data=child.val();


list += `

<button onclick="loadCustomerById('${id}')">

${id} - ${data.name || "بدون اسم"}

</button>

`;



});


document.getElementById("customerList").innerHTML=list;


});


}





function loadCustomerById(id){

document.getElementById("searchId").value=id;

loadCustomer();

}





function loadCustomer(){


let id=document.getElementById("searchId").value;


if(id==""){

alert("اكتب رقم العميل");

return;

}



db.ref("customers/"+id).once("value")

.then(function(snapshot){


let data=snapshot.val();


if(!data){

alert("العميل غير موجود");

return;

}



document.getElementById("id").value=id;

document.getElementById("name").value=data.name || "";

document.getElementById("description").value=data.description || "";

document.getElementById("logo").value=data.logo || "";

document.getElementById("whatsapp").value=data.whatsapp || "";

document.getElementById("facebook").value=data.facebook || "";

document.getElementById("instagram").value=data.instagram || "";

document.getElementById("website").value=data.website || "";

document.getElementById("payment").value=data.payment || "";


alert("تم تحميل بيانات العميل ✅");


});


}





function saveCustomer(){


let number=document.getElementById("id").value;


let data={


name:document.getElementById("name").value,

description:document.getElementById("description").value,

logo:document.getElementById("logo").value,

whatsapp:document.getElementById("whatsapp").value,

facebook:document.getElementById("facebook").value,

instagram:document.getElementById("instagram").value,

website:document.getElementById("website").value,

payment:document.getElementById("payment").value


};



db.ref("customers/"+number).set(data)

.then(function(){


alert("تم الحفظ بنجاح ✅");


loadCustomers();


})

.catch(function(error){

alert("خطأ: "+error.message);

});


}







function createQR(){


let number=document.getElementById("id").value;


let url=

"https://mohamdsagrsy692-a11y.github.io/qr-system/qr.html?id="+number;



document.getElementById("qrLink").innerHTML=url;


document.getElementById("qrcode").innerHTML="";



new QRCode(

document.getElementById("qrcode"),

{

text:url,

width:250,

height:250

}

);



setTimeout(function(){

qrImage=document.querySelector("#qrcode img");

},500);


}






function downloadQR(){


if(!qrImage){

alert("أنشئ QR أولاً");

return;

}


let a=document.createElement("a");

a.href=qrImage.src;

a.download="QR.png";

a.click();


}


</script>


</body>

</html>
