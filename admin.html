<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<title>إدارة QR</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:30px;
}

.card{
background:white;
max-width:450px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 0 10px #ccc;
}

input,textarea{
width:90%;
padding:12px;
margin:8px;
border-radius:10px;
border:1px solid #ccc;
}

textarea{
height:80px;
}

button{
background:#111;
color:white;
padding:15px;
width:90%;
border:0;
border-radius:10px;
margin-top:10px;
cursor:pointer;
}

#qrcode{
margin:20px auto;
}

</style>

</head>


<body>


<div id="login" class="card">

<h2>دخول الإدارة</h2>

<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">
دخول
</button>

</div>



<div id="panel" class="card" style="display:none">

<h2>إضافة عميل جديد</h2>


<input id="id" readonly>


<input id="name" placeholder="اسم النشاط">


<textarea id="description" placeholder="وصف النشاط"></textarea>


<input id="logo" placeholder="رابط اللوجو">


<input id="whatsapp" placeholder="واتساب">


<input id="facebook" placeholder="فيسبوك">


<input id="instagram" placeholder="انستجرام">


<input id="website" placeholder="الموقع">


<input id="payment" placeholder="الدفع">


<button id="saveBtn">
حفظ العميل
</button>


<button id="qrBtn">
إنشاء QR
</button>


<div id="qrcode"></div>

<p id="qrLink"></p>


<button id="downloadBtn">
تحميل QR PNG
</button>


</div>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>


const firebaseConfig = {

apiKey: "AIzaSyDAXHBPfJUr2quRe_8OyhEDqGrHaneNmcc",

authDomain: "qr-system-45702.firebaseapp.com",

databaseURL: "https://qr-system-45702-default-rtdb.firebaseio.com",

projectId: "qr-system-45702",

storageBucket: "qr-system-45702.firebasestorage.app",

messagingSenderId: "983573164670",

appId: "1:983573164670:web:4b352977dd6085b0649e2f"

};


firebase.initializeApp(firebaseConfig);


const db = firebase.database();


let qrImage;



document.getElementById("loginBtn").onclick=function(){


let pass=document.getElementById("password").value;


if(pass==="CODE010951"){

document.getElementById("login").style.display="none";

document.getElementById("panel").style.display="block";

generateNumber();

}

else{

alert("كلمة المرور غير صحيحة");

}

};





function generateNumber(){


let number =
localStorage.getItem("qrNumber") || 1;


let code =
String(number).padStart(3,"0");


document.getElementById("id").value=code;


}





document.getElementById("saveBtn").onclick=function(){


let number=document.getElementById("id").value;


let data={

name:name.value,

description:description.value,

logo:logo.value,

whatsapp:whatsapp.value,

facebook:facebook.value,

instagram:instagram.value,

website:website.value,

payment:payment.value

};


db.ref("customers/"+number).set(data)

.then(()=>{

alert("تم حفظ العميل في Firebase ✅");


localStorage.setItem(
"qrNumber",
Number(number)+1
);

})

.catch(e=>{

alert(e.message);

});


};






document.getElementById("qrBtn").onclick=function(){


let number=document.getElementById("id").value;


let url=
"https://mohamdsagrsy692-a11y.github.io/qr-system/qr.html?id="
+number;



document.getElementById("qrLink").innerHTML=url;


document.getElementById("qrcode").innerHTML="";



new QRCode(

document.getElementById("qrcode"),

{

text:url,

width:250,

height:250,

correctLevel:QRCode.CorrectLevel.H

}

);



setTimeout(()=>{

qrImage=document.querySelector("#qrcode img");

},500);


};





document.getElementById("downloadBtn").onclick=function(){


if(!qrImage){

alert("أنشئ QR أولاً");

return;

}


let a=document.createElement("a");

a.href=qrImage.src;

a.download="QR.png";

a.click();


};


</script>


</body>
</html>
