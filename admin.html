<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة العملاء - QR Admin</title>
    
    <!-- مكتبة إنشاء وتخصيص QR Code -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2, h3 {
            text-align: center;
            margin-bottom: 20px;
            color: #222;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        input[type="text"], input[type="color"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="color"] {
            height: 42px;
            padding: 4px;
            cursor: pointer;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: #222;
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .btn-upload {
            background: #4A5568;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-save {
            background-color: #111;
            color: #fff;
        }

        .btn-delete {
            background-color: #c53030;
            color: #fff;
        }

        .btn-qr {
            background-color: #2d3748;
            color: #fff;
        }

        .btn-download {
            background-color: #111;
            color: #fff;
            margin-top: 10px;
        }

        /* قسم معاينة الـ QR */
        .qr-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        #qrContainer {
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        /* صندوق إعدادات التحميل */
        .download-box {
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            border: 1px solid #cbd5e0;
        }

        /* صندوق التخصيص */
        .qr-custom-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preview-logo {
            max-width: 80px;
            max-height: 80px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>إدارة العملاء</h2>

    <div class="form-group">
        <label>اختيار عمل</label>
        <select id="customerSelect" onchange="loadSelectedCustomer()">
            <option value="">اختر العميل</option>
        </select>
    </div>

    <div class="form-group">
        <label>كود العميل للبحث</label>
        <input type="text" id="searchCode" placeholder="CODE001">
    </div>

    <button class="btn btn-save" onclick="searchCustomerByCode()">تحميل بيانات العميل</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <div class="form-group">
        <label>كود العميل</label>
        <input type="text" id="code" placeholder="CODE001" oninput="updateQRLive()">
    </div>

    <div class="form-group">
        <label>اسم النشاط</label>
        <input type="text" id="name" placeholder="النور">
    </div>

    <div class="form-group">
        <label>وصف النشاط</label>
        <textarea id="description" rows="2" placeholder="الدعاية والاعلان"></textarea>
    </div>

    <!-- رفع لوجو العميل الأساسي -->
    <div class="form-group">
        <label>صورة اللوجو الأساسية للنشاط</label>
        <div class="file-input-wrapper">
            <input type="text" id="logo" placeholder="رابط صورة اللوجو أو اختر من المعرض" onchange="updateQRLive()">
            <label class="btn-upload" for="logoFileInput">اختر صورة من المعرض</label>
            <input type="file" id="logoFileInput" accept="image/*" onchange="handleMainLogoUpload(this)">
        </div>
        <img id="logoPreview" class="preview-logo" alt="معاينة اللوجو">
    </div>

    <div class="form-group">
        <label>واتساب</label>
        <input type="text" id="whatsapp" placeholder="رابط واتساب">
    </div>

    <div class="form-group">
        <label>فيسبوك</label>
        <input type="text" id="facebook" placeholder="رابط فيسبوك">
    </div>

    <div class="form-group">
        <label>انستجرام</label>
        <input type="text" id="instagram" placeholder="رابط انستجرام">
    </div>

    <div class="form-group">
        <label>الموقع</label>
        <input type="text" id="website" placeholder="رابط الموقع">
    </div>

    <div class="form-group">
        <label>InstaPay</label>
        <input type="text" id="instapay" placeholder="رابط InstaPay">
    </div>

    <div class="form-group">
        <label>Vodafone Cash</label>
        <input type="text" id="vodafonecash" placeholder="رابط Vodafone Cash">
    </div>

    <div class="form-group">
        <label>الحقوق (الفوتر)</label>
        <input type="text" id="footer" placeholder="اتركها فارغة لظهور: جميع الحقوق محفوظة ✓">
    </div>

    <!-- 📍 معاينة الـ QR وخيارات التحميل المنسدلة -->
    <div class="qr-section" id="qrSection">
        <h3 style="font-size:18px; margin-bottom:5px;">معاينة الـ QR</h3>
        <div id="qrContainer"></div>

        <!-- 📥 خيارات مقاس وصيغة الملف قبل التحميل -->
        <div class="download-box">
            <div class="grid-2">
                <div class="form-group" style="margin-bottom:5px;">
                    <label style="text-align:right;">صيغة الحفظ</label>
                    <select id="downloadFormat">
                        <option value="png" selected>PNG (صورة عالية الوضوح)</option>
                        <option value="jpeg">JPEG / JPG</option>
                        <option value="svg">SVG (فيكتور للطباعة/الفيبر)</option>
                        <option value="webp">WEBP</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:5px;">
                    <label style="text-align:right;">أبعاد المقاس (Size)</label>
                    <select id="downloadSize">
                        <option value="300">300x300 px (صغير للموبايل)</option>
                        <option value="1000" selected>1000x1000 px (قياسي للطباعة)</option>
                        <option value="2000">2000x2000 px (عالي الدقة HQ)</option>
                        <option value="4000">4000x4000 px (Ultra HD للوحة كبيرة)</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-download" onclick="downloadQR()">تحميل الـ QR بالخيارات المحددة</button>
        </div>
    </div>

    <!-- 🎨 تخصيص الـ QR Code -->
    <div class="qr-custom-box">
        <h3 style="font-size:16px; text-align:right; margin-bottom:12px;">🎨 تخصيص شكل الـ QR Code</h3>
        
        <div class="grid-2">
            <div class="form-group">
                <label>لون نقاط الـ QR</label>
                <input type="color" id="qrDotColor" value="#000000" oninput="updateQRLive()">
            </div>
            <div class="form-group">
                <label>لون الخلفية</label>
                <input type="color" id="qrBgColor" value="#ffffff" oninput="updateQRLive()">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>شكل النقاط</label>
                <select id="qrDotType" onchange="updateQRLive()">
                    <option value="square" selected>كلاسيكي قياسي (مربعات صريحة)</option>
                    <option value="rounded">انحناء ناعم (Rounded)</option>
                    <option value="dots">نقاط دائرية (Dots)</option>
                </select>
            </div>
            <div class="form-group">
                <label>شكل زوايا الـ QR</label>
                <select id="qrCornerType" onchange="updateQRLive()">
                    <option value="square" selected>مربع كلاسيكي (Square)</option>
                    <option value="dot">دائري (Dot)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>صورة اللوجو لمنتصف الـ QR (اختياري من المعرض)</label>
            <div class="file-input-wrapper">
                <input type="text" id="qrCustomLogo" placeholder="اختر لوجو خاص بالـ QR أو يترك لاستخدام لوجو العميل" onchange="updateQRLive()">
                <label class="btn-upload" for="qrLogoFileInput">من المعرض</label>
                <input type="file" id="qrLogoFileInput" accept="image/*" onchange="handleQRLogoUpload(this)">
            </div>
        </div>

        <div class="form-group">
            <label>إظهار اللوجو وسط الـ QR؟</label>
            <select id="qrEmbedLogo" onchange="updateQRLive()">
                <option value="yes" selected>نعم</option>
                <option value="no">لا (بدون لوجو في المنتصف)</option>
            </select>
        </div>
    </div>

    <button class="btn btn-save" onclick="saveCustomer()">حفظ العميل</button>
    <button class="btn btn-delete" onclick="deleteCustomer()">حذف العميل</button>
    <button class="btn btn-qr" onclick="generateQR()">إنشاء / تحديث QR</button>

</div>

<!-- خدمات فايربيس -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaDAXHBPfJUr2quRe_8OyhEDqGrHaneNmcc",
        authDomain: "qr-system-45702.firebaseapp.com",
        databaseURL: "https://qr-system-45702-default-rtdb.firebaseio.com",
        projectId: "qr-system-45702",
        storageBucket: "qr-system-45702.firebasestorage.app",
        messagingSenderId: "983573164670",
        appId: "1:983573164670:web:4b352977dd6085b0649e2f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let qrCodeInstance = null;

    function SafeSetValue(id, val) {
        const el = document.getElementById(id);
        if (el) el.value = val || "";
    }

    function SafeGetValue(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
    }

    function handleMainLogoUpload(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                SafeSetValue("logo", e.target.result);
                const preview = document.getElementById("logoPreview");
                if (preview) {
                    preview.src = e.target.result;
                    preview.style.display = "block";
                }
                updateQRLive();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function handleQRLogoUpload(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                SafeSetValue("qrCustomLogo", e.target.result);
                updateQRLive();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function loadCustomerList() {
        db.ref("customers").on("value", function(snapshot) {
            const select = document.getElementById("customerSelect");
            select.innerHTML = '<option value="">اختر العميل</option>';
            snapshot.forEach(function(child) {
                const data = child.val();
                const option = document.createElement("option");
                option.value = child.key;
                option.textContent = (data.name || "عميل بدون اسم") + " (" + child.key + ")";
                select.appendChild(option);
            });
        });
    }

    loadCustomerList();

    function loadSelectedCustomer() {
        const id = SafeGetValue("customerSelect");
        if (!id) return;

        db.ref("customers/" + id).once("value").then(function(snapshot) {
            const data = snapshot.val();
            if (data) {
                populateForm(id, data);
            }
        });
    }

    function searchCustomerByCode() {
        const code = SafeGetValue("searchCode");
        if (!code) {
            alert("يرجى إدخال كود العميل أولاً");
            return;
        }

        db.ref("customers/" + code).once("value").then(function(snapshot) {
            const data = snapshot.val();
            if (data) {
                populateForm(code, data);
            } else {
                alert("لم يتم العثور على عميل بهذا الكود");
            }
        });
    }

    function populateForm(id, data) {
        SafeSetValue("code", id);
        SafeSetValue("name", data.name);
        SafeSetValue("description", data.description);
        SafeSetValue("logo", data.logo);
        SafeSetValue("whatsapp", data.whatsapp);
        SafeSetValue("facebook", data.facebook);
        SafeSetValue("instagram", data.instagram);
        SafeSetValue("website", data.website);
        SafeSetValue("instapay", data.instapay);
        SafeSetValue("vodafonecash", data.vodafonecash);
        SafeSetValue("footer", data.footer);

        const preview = document.getElementById("logoPreview");
        if (data.logo && preview) {
            preview.src = data.logo;
            preview.style.display = "block";
        } else if (preview) {
            preview.style.display = "none";
        }

        generateQR();
    }

    function saveCustomer() {
        const code = SafeGetValue("code");
        if (!code) {
            alert("يرجى إدخال كود العميل أولاً");
            return;
        }

        const customerData = {
            name: SafeGetValue("name"),
            description: SafeGetValue("description"),
            logo: SafeGetValue("logo"),
            whatsapp: SafeGetValue("whatsapp"),
            facebook: SafeGetValue("facebook"),
            instagram: SafeGetValue("instagram"),
            website: SafeGetValue("website"),
            instapay: SafeGetValue("instapay"),
            vodafonecash: SafeGetValue("vodafonecash"),
            footer: SafeGetValue("footer")
        };

        db.ref("customers/" + code).set(customerData)
            .then(function() {
                alert("تم حفظ بيانات العميل بنجاح!");
            })
            .catch(function(error) {
                alert("حدث خطأ أثناء الحفظ: " + error.message);
            });
    }

    function deleteCustomer() {
        const code = SafeGetValue("code");
        if (!code) {
            alert("يرجى تحديد كود العميل للحذف");
            return;
        }

        if (confirm("هل أنت تأكد من حذف هذا العميل نهائياً؟")) {
            db.ref("customers/" + code).remove()
                .then(function() {
                    alert("تم حذف العميل بنجاح");
                    clearForm();
                })
                .catch(function(error) {
                    alert("خطأ أثناء الحذف: " + error.message);
                });
        }
    }

    function clearForm() {
        SafeSetValue("code", "");
        SafeSetValue("searchCode", "");
        SafeSetValue("name", "");
        SafeSetValue("description", "");
        SafeSetValue("logo", "");
        SafeSetValue("qrCustomLogo", "");
        SafeSetValue("whatsapp", "");
        SafeSetValue("facebook", "");
        SafeSetValue("instagram", "");
        SafeSetValue("website", "");
        SafeSetValue("instapay", "");
        SafeSetValue("vodafonecash", "");
        SafeSetValue("footer", "");
        document.getElementById("customerSelect").value = "";
        const preview = document.getElementById("logoPreview");
        if (preview) preview.style.display = "none";
        document.getElementById("qrSection").style.display = "none";
    }

    function updateQRLive() {
        const code = SafeGetValue("code");
        if (code && document.getElementById("qrSection").style.display === "block") {
            generateQR();
        }
    }

    function generateQR() {
        const code = SafeGetValue("code");
        if (!code) {
            alert("يرجى إدخال كود العميل أولاً");
            return;
        }

        const targetURL = window.location.origin + window.location.pathname.replace("admin.html", "qr.html") + "?id=" + encodeURIComponent(code);

        const dotColor = SafeGetValue("qrDotColor") || "#000000";
        const bgColor = SafeGetValue("qrBgColor") || "#ffffff";
        const dotType = SafeGetValue("qrDotType") || "square";
        const cornerType = SafeGetValue("qrCornerType") || "square";
        const embedLogo = SafeGetValue("qrEmbedLogo");
        const finalLogo = SafeGetValue("qrCustomLogo") || SafeGetValue("logo");

        const qrContainer = document.getElementById("qrContainer");
        qrContainer.innerHTML = "";

        const qrConfig = {
            width: 260,
            height: 260,
            type: "canvas",
            data: targetURL,
            dotsOptions: {
                color: dotColor,
                type: dotType
            },
            backgroundOptions: {
                color: bgColor
            },
            cornersSquareOptions: {
                type: cornerType,
                color: dotColor
            },
            cornersDotOptions: {
                type: cornerType,
                color: dotColor
            },
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 4,
                imageSize: 0.26
            }
        };

        if (embedLogo === "yes" && finalLogo) {
            qrConfig.image = finalLogo;
        }

        qrCodeInstance = new QRCodeStyling(qrConfig);
        qrCodeInstance.append(qrContainer);
        document.getElementById("qrSection").style.display = "block";
    }

    // 📥 تحميل الـ QR بناءً على الصيغة والمقاس المحددين في القائمة
    function downloadQR() {
        const code = SafeGetValue("code") || "QR_Code";
        const selectedFormat = SafeGetValue("downloadFormat") || "png";
        const selectedSize = parseInt(SafeGetValue("downloadSize")) || 1000;

        if (qrCodeInstance) {
            // إنشاء كائن مؤقت لإعادة إنشاء الـ QR بمقاس التحميل المخصص دون التأثير على معاينة الشاشة
            const targetURL = window.location.origin + window.location.pathname.replace("admin.html", "qr.html") + "?id=" + encodeURIComponent(code);
            const dotColor = SafeGetValue("qrDotColor") || "#000000";
            const bgColor = SafeGetValue("qrBgColor") || "#ffffff";
            const dotType = SafeGetValue("qrDotType") || "square";
            const cornerType = SafeGetValue("qrCornerType") || "square";
            const embedLogo = SafeGetValue("qrEmbedLogo");
            const finalLogo = SafeGetValue("qrCustomLogo") || SafeGetValue("logo");

            const exportConfig = {
                width: selectedSize,
                height: selectedSize,
                type: selectedFormat === "svg" ? "svg" : "canvas",
                data: targetURL,
                dotsOptions: { color: dotColor, type: dotType },
                backgroundOptions: { color: bgColor },
                cornersSquareOptions: { type: cornerType, color: dotColor },
                cornersDotOptions: { type: cornerType, color: dotColor },
                imageOptions: { crossOrigin: "anonymous", margin: selectedSize * 0.015, imageSize: 0.26 }
            };

            if (embedLogo === "yes" && finalLogo) {
                exportConfig.image = finalLogo;
            }

            const exportQR = new QRCodeStyling(exportConfig);
            exportQR.download({ name: code + "_" + selectedSize + "px", extension: selectedFormat });
        }
    }
</script>

</body>
</html>
