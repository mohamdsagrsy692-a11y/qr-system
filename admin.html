<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة QR - V5 Pro</title>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f2f4f8;
  text-align:center;
  padding:24px;
  margin:0;
  color:#151515;
}

.card{
  background:#fff;
  width:95%;
  max-width:1400px;
  margin:auto;
  padding:26px;
  border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.10);
}

#login{
  max-width:420px;
}

.dashboard{
  display:flex;
  gap:24px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.left-panel{
  flex:1 1 520px;
  text-align:right;
}

.right-panel{
  flex:0 1 430px;
  background:#fafafa;
  padding:20px;
  border-radius:18px;
  border:1px solid #e4e4e4;
  text-align:right;
}

.section-title{
  font-size:20px;
  font-weight:700;
  margin:0 0 16px;
}

.field-label{
  display:block;
  font-weight:600;
  margin:12px 4px 4px;
}

input,textarea,select{
  width:100%;
  padding:12px 14px;
  margin:6px 0;
  border-radius:11px;
  border:1px solid #d3d7dd;
  background:#fff;
  font:inherit;
}

textarea{height:90px;resize:vertical}

button{
  background:#111;
  color:#fff;
  padding:13px 16px;
  width:100%;
  border:0;
  border-radius:11px;
  margin-top:10px;
  cursor:pointer;
  font:inherit;
  font-weight:700;
}

button:hover{opacity:.92}

.danger{background:#c62828}

.preview-box{
  background:#fff;
  border:1px solid #e6e6e6;
  border-radius:18px;
  padding:18px;
  min-height:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#qrcode{
  margin:10px auto 8px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#qrcode canvas,
#qrcode img{
  max-width:100%;
  height:auto;
}

#qrLink{
  width:100%;
  word-break:break-all;
  font-size:12px;
  color:#666;
  margin:8px 0 4px;
  direction:ltr;
  text-align:center;
}

#bottomPreview{
  min-height:20px;
  margin-top:4px;
  font-weight:700;
  font-size:18px;
  text-align:center;
}

.color-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.small-note{
  color:#777;
  font-size:12px;
  line-height:1.6;
}

hr{
  border:0;
  border-top:1px solid #e5e5e5;
  margin:20px 0;
}

@media (max-width:800px){
  body{padding:12px}
  .card{width:100%;padding:16px}
  .left-panel,.right-panel{min-width:100%;width:100%}
}

.scan-frame{background:#111;padding:14px;border-radius:20px;display:inline-block}
.scan-footer{background:#111;color:#fff;padding:12px;text-align:center;font-weight:bold;border-radius:0 0 16px 16px}
</style>

<style>
.tab-buttons{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tab-buttons button{width:auto;padding:10px 14px}
.tab-content{border:1px solid #e5e5e5;padding:10px;border-radius:12px;margin-top:8px}
</style>

<style>
.tab-panel{display:none}
.tab-panel.active{display:block}
.tab-buttons button.active{background:#2563eb}
</style>

<style>
.qr-frame{background:#111;padding:14px;border-radius:20px;display:inline-block}
.qr-footer{background:#111;color:#fff;padding:10px;border-radius:0 0 16px 16px;text-align:center;font-weight:bold}
</style>
</head>

<body>

<div id="login" class="card">
  <h2>دخول الإدارة</h2>
  <input id="password" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
</div>

<div id="panel" class="card" style="display:none">
  <div class="dashboard">

    <div class="left-panel">
      <h2>إدارة العملاء</h2>

      <label class="field-label">اختيار عميل</label>
      <select id="customerList" onchange="selectCustomer()">
        <option value="">اختر العميل</option>
      </select>

      <label class="field-label">كود العميل للبحث</label>
      <input id="searchId" placeholder="مثال: CODE001">

      <button onclick="loadCustomer()">تحميل بيانات العميل</button>

      <label class="field-label">كود العميل</label>
      <input id="id" readonly>

      <label class="field-label">اسم النشاط</label>
      <input id="name" placeholder="اسم النشاط">

      <label class="field-label">وصف النشاط</label>
      <textarea id="description" placeholder="وصف النشاط"></textarea>

      <label class="field-label">رابط اللوجو</label>
      <input id="logo" placeholder="رابط صورة اللوجو">

      <label class="field-label">واتساب</label>
      <input id="whatsapp" placeholder="رابط واتساب">

      <label class="field-label">فيسبوك</label>
      <input id="facebook" placeholder="رابط فيسبوك">

      <label class="field-label">انستجرام</label>
      <input id="instagram" placeholder="رابط انستجرام">

      <label class="field-label">الموقع</label>
      <input id="website" placeholder="رابط الموقع">

      <label class="field-label">الدفع</label>
      <input id="payment" placeholder="رابط الدفع">

      <button onclick="saveCustomer()">حفظ العميل</button>
      <button class="danger" onclick="deleteCustomer()">حذف العميل</button>
      <button onclick="createQR()">إنشاء / تحديث QR</button>
    </div>

    <div class="right-panel">
      <div class="section-title">معاينة QR</div>

      <div class="preview-box">
        <div id="qrcode"></div>
        <div id="bottomPreview"></div>
        <p id="qrLink"></p>
        <button onclick="downloadQR()">تحميل QR PNG</button>
      </div>

      <hr>

      <div class="section-title">تصميم QR</div>
      <div class="tab-buttons">
        <button type="button">Templates</button>
        <button type="button">Colors</button>
        <button type="button">Logo</button>
        <button type="button">Download</button>
      </div>

      <br>
      <label class="field-label">قالب جاهز</label>
      <select id="templateStyle">
        <option value="">اختيار قالب</option>
        <option value="business">Business</option>
        <option value="restaurant">Restaurant</option>
        <option value="payment">Payment</option>
        <option value="luxury">Luxury Gold</option>
        <option value="social">Social Media</option>
      </select>
      <button onclick="applyTemplate()">تطبيق القالب</button>

      <label class="field-label">لون النقاط</label>
      <input type="color" id="dotColor" value="#000000">

      <label class="field-label">شكل النقاط</label>
      <select id="dotStyle">
        <option value="square">Square</option>
        <option value="rounded">Rounded</option>
        <option value="dots">Dots</option>
        <option value="classy">Classy</option>
        <option value="classy-rounded">Classy Rounded</option>
      </select>

      <div class="color-row">
        <div>
          <label class="field-label">لون الزوايا</label>
          <input type="color" id="cornerColor" value="#000000">
        </div>
        <div>
          <label class="field-label">لون الخلفية</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
      </div>

      <label class="field-label">شكل زوايا QR</label>
      <select id="cornerStyle">
        <option value="square">Square</option>
        <option value="dot">Dot</option>
        <option value="extra-rounded">Extra Rounded</option>
      </select>

      <label class="field-label">رابط اللوجو داخل QR (اختياري)</label>
      <input id="qrLogo" placeholder="https://...">

      <label class="field-label">رفع لوجو من الجهاز</label>
      <input type="file" id="logoUpload" accept="image/*">
      <img id="logoPreview" style="max-width:120px;display:none;margin:10px auto;border-radius:12px;border:1px solid #ddd;padding:5px;">

      <label class="field-label">نوع الإطار</label>
      <select id="frameStyle">
        <option>Classic</option>
        <option>Modern</option>
        <option>Luxury</option>
        <option>Business</option>
        <option>Rounded</option>
      </select>
      
      <label class="field-label">صيغة التحميل</label>
      <select id="downloadFormat">
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="svg">SVG</option>
        <option value="webp">WEBP</option>
      </select>

      <label class="field-label">Gradient 1</label>
      <input type="color" id="gradient1" value="#000000">

      <label class="field-label">Gradient 2</label>
      <input type="color" id="gradient2" value="#0066ff">

      <label class="field-label">النص أسفل QR</label>
      <input id="bottomText" placeholder="يمكن تركه فارغًا">

      <button onclick="resetQRDesign()">إعادة الإعدادات الافتراضية</button>

      <div class="small-note">
        المعاينة تعرض النص أسفل QR. في هذه المرحلة، تحميل PNG ينزل QR نفسه من مكتبة التوليد؛
        إضافة إطار/نص/تصميم كامل داخل ملف PNG ستكون في خطوة التخصيص المتقدمة التالية.
      </div>
    </div>

  </div>
</div>

<!-- استدعاء الملفات الخارجية بعد حذف كل السكريبتات المكررة من الملف -->
<script src="js/firebase.js"></script>
<script src="js/customers.js"></script>
<script src="js/qr-generator.js"></script>
<script src="js/ui.js"></script>

</body>
</html>
