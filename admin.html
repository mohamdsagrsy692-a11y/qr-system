<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إدارة QR</title>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f2f4f8;
  text-align:center;
  padding:24px;
  margin:0;
  color:#151515;
}

.card{
  background:#fff;
  width:95%;
  max-width:1400px;
  margin:auto;
  padding:26px;
  border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.10);
}

#login{
  max-width:420px;
}

.dashboard{
  display:flex;
  gap:24px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.left-panel{
  flex:1 1 520px;
  text-align:right;
}

.right-panel{
  flex:0 1 430px;
  background:#fafafa;
  padding:20px;
  border-radius:18px;
  border:1px solid #e4e4e4;
  text-align:right;
}

.section-title{
  font-size:20px;
  font-weight:700;
  margin:0 0 16px;
}

.field-label{
  display:block;
  font-weight:600;
  margin:12px 4px 4px;
}

input,textarea,select{
  width:100%;
  padding:12px 14px;
  margin:6px 0;
  border-radius:11px;
  border:1px solid #d3d7dd;
  background:#fff;
  font:inherit;
}

textarea{height:90px;resize:vertical}

button{
  background:#111;
  color:#fff;
  padding:13px 16px;
  width:100%;
  border:0;
  border-radius:11px;
  margin-top:10px;
  cursor:pointer;
  font:inherit;
  font-weight:700;
}

button:hover{opacity:.92}

.danger{background:#c62828}

.preview-box{
  background:#fff;
  border:1px solid #e6e6e6;
  border-radius:18px;
  padding:18px;
  min-height:390px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#qrcode{
  margin:10px auto 8px;
  display:flex;
  justify-content:center;
  align-items:center;
}

#qrcode canvas,
#qrcode img{
  max-width:100%;
  height:auto;
}

#qrLink{
  width:100%;
  word-break:break-all;
  font-size:12px;
  color:#666;
  margin:8px 0 4px;
  direction:ltr;
  text-align:center;
}

#bottomPreview{
  min-height:20px;
  margin-top:4px;
  font-weight:700;
  font-size:18px;
  text-align:center;
}

.color-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.small-note{
  color:#777;
  font-size:12px;
  line-height:1.6;
}

hr{
  border:0;
  border-top:1px solid #e5e5e5;
  margin:20px 0;
}

@media (max-width:800px){
  body{padding:12px}
  .card{width:100%;padding:16px}
  .left-panel,.right-panel{min-width:100%;width:100%}
}
</style>
</head>

<body>

<div id="login" class="card">
  <h2>دخول الإدارة</h2>
  <input id="password" type="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
</div>

<div id="panel" class="card" style="display:none">
  <div class="dashboard">

    <div class="left-panel">
      <h2>إدارة العملاء</h2>

      <label class="field-label">اختيار عميل</label>
      <select id="customerList" onchange="selectCustomer()">
        <option value="">اختر العميل</option>
      </select>

      <label class="field-label">كود العميل للبحث</label>
      <input id="searchId" placeholder="مثال: CODE001">

      <button onclick="loadCustomer()">تحميل بيانات العميل</button>

      <label class="field-label">كود العميل</label>
      <input id="id" readonly>

      <label class="field-label">اسم النشاط</label>
      <input id="name" placeholder="اسم النشاط">

      <label class="field-label">وصف النشاط</label>
      <textarea id="description" placeholder="وصف النشاط"></textarea>

      <label class="field-label">رابط اللوجو</label>
      <input id="logo" placeholder="رابط صورة اللوجو">

      <label class="field-label">واتساب</label>
      <input id="whatsapp" placeholder="رابط واتساب">

      <label class="field-label">فيسبوك</label>
      <input id="facebook" placeholder="رابط فيسبوك">

      <label class="field-label">انستجرام</label>
      <input id="instagram" placeholder="رابط انستجرام">

      <label class="field-label">الموقع</label>
      <input id="website" placeholder="رابط الموقع">

      <label class="field-label">الدفع</label>
      <input id="payment" placeholder="رابط الدفع">

      <button onclick="saveCustomer()">حفظ العميل</button>
      <button class="danger" onclick="deleteCustomer()">حذف العميل</button>
      <button onclick="createQR()">إنشاء / تحديث QR</button>
    </div>

    <div class="right-panel">
      <div class="section-title">معاينة QR</div>

      <div class="preview-box">
        <div id="qrcode"></div>
        <div id="bottomPreview"></div>
        <p id="qrLink"></p>
        <button onclick="downloadQR()">تحميل QR PNG</button>
      </div>

      <hr>

      <div class="section-title">تصميم QR</div>

      <label class="field-label">لون النقاط</label>
      <input type="color" id="dotColor" value="#000000">

      <label class="field-label">شكل النقاط</label>
      <select id="dotStyle">
        <option value="square">Square</option>
        <option value="rounded" selected>Rounded</option>
        <option value="dots">Dots</option>
        <option value="classy">Classy</option>
        <option value="classy-rounded">Classy Rounded</option>
      </select>

      <div class="color-row">
        <div>
          <label class="field-label">لون الزوايا</label>
          <input type="color" id="cornerColor" value="#000000">
        </div>
        <div>
          <label class="field-label">لون الخلفية</label>
          <input type="color" id="bgColor" value="#ffffff">
        </div>
      </div>

      <label class="field-label">شكل زوايا QR</label>
      <select id="cornerStyle">
        <option value="square">Square</option>
        <option value="dot">Dot</option>
        <option value="extra-rounded">Extra Rounded</option>
      </select>

      <label class="field-label">رابط اللوجو داخل QR (اختياري)</label>
      <input id="qrLogo" placeholder="https://...">

      <label class="field-label">النص أسفل QR</label>
      <input id="bottomText" placeholder="يمكن تركه فارغًا">

      <button onclick="createQR()">تحديث المعاينة</button>
      <button onclick="resetQRDesign()">إعادة الإعدادات الافتراضية</button>

      <div class="small-note">
        المعاينة تعرض النص أسفل QR. في هذه المرحلة، تحميل PNG ينزل QR نفسه من مكتبة التوليد؛
        إضافة إطار/نص/تصميم كامل داخل ملف PNG ستكون في خطوة التخصيص المتقدمة التالية.
      </div>
    </div>

  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDAXHBPfJUr2quRe_80yhEDqGrHaneNmcc",
  authDomain: "qr-system-45702.firebaseapp.com",
  databaseURL: "https://qr-system-45702-default-rtdb.firebaseio.com",
  projectId: "qr-system-45702",
  storageBucket: "qr-system-45702.firebasestorage.app",
  messagingSenderId: "983573164670",
  appId: "1:983573164670:web:4b352977dd6085b0649e2f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let qrCode = null;

function login(){
  const pass = document.getElementById("password").value;

  if(pass === "CODE010951"){
    document.getElementById("login").style.display = "none";
    document.getElementById("panel").style.display = "block";
    generateNumber();
    loadCustomers();
  }else{
    alert("كلمة المرور غير صحيحة");
  }
}

function generateNumber(){
  db.ref("customers").once("value").then(function(snapshot){
    let max = 0;

    snapshot.forEach(function(child){
      const code = child.key || "";

      if(code.startsWith("CODE")){
        const number = parseInt(code.replace("CODE",""), 10) || 0;
        if(number > max) max = number;
      }
    });

    const next = max + 1;
    document.getElementById("id").value =
      "CODE" + String(next).padStart(3,"0");
  });
}

function loadCustomers(){
  db.ref("customers").once("value").then(function(snapshot){
    const select = document.getElementById("customerList");
    select.innerHTML = '<option value="">اختر العميل</option>';

    snapshot.forEach(function(child){
      const id = child.key;
      const data = child.val() || {};
      const option = document.createElement("option");

      option.value = id;
      option.textContent = id + " - " + (data.name || "بدون اسم");

      select.appendChild(option);
    });
  }).catch(function(error){
    alert("تعذر تحميل العملاء: " + error.message);
  });
}

function selectCustomer(){
  const id = document.getElementById("customerList").value;

  if(id){
    document.getElementById("searchId").value = id;
    loadCustomer();
  }
}

function loadCustomer(){
  const id = document.getElementById("searchId").value.trim();

  if(!id){
    alert("اكتب كود العميل");
    return;
  }

  db.ref("customers/" + id).once("value").then(function(snapshot){
    const data = snapshot.val();

    if(!data){
      alert("العميل غير موجود");
      return;
    }

    document.getElementById("id").value = id;
    document.getElementById("name").value = data.name || "";
    document.getElementById("description").value = data.description || "";
    document.getElementById("logo").value = data.logo || "";
    document.getElementById("whatsapp").value = data.whatsapp || "";
    document.getElementById("facebook").value = data.facebook || "";
    document.getElementById("instagram").value = data.instagram || "";
    document.getElementById("website").value = data.website || "";
    document.getElementById("payment").value = data.payment || "";

    if(data.qrStyle){
      document.getElementById("dotColor").value = data.qrStyle.dotColor || "#000000";
      document.getElementById("dotStyle").value = data.qrStyle.dotStyle || "rounded";
      document.getElementById("cornerColor").value = data.qrStyle.cornerColor || "#000000";
      document.getElementById("cornerStyle").value = data.qrStyle.cornerStyle || "square";
      document.getElementById("bgColor").value = data.qrStyle.bgColor || "#ffffff";
      document.getElementById("qrLogo").value = data.qrStyle.qrLogo || "";
      document.getElementById("bottomText").value = data.qrStyle.bottomText || "";
    }else{
      resetQRDesign();
    }

    document.getElementById("customerList").value = id;
    updateBottomPreview();
  }).catch(function(error){
    alert("تعذر تحميل العميل: " + error.message);
  });
}

function getQRStyleData(){
  return {
    dotColor: document.getElementById("dotColor").value,
    dotStyle: document.getElementById("dotStyle").value,
    cornerColor: document.getElementById("cornerColor").value,
    cornerStyle: document.getElementById("cornerStyle").value,
    bgColor: document.getElementById("bgColor").value,
    qrLogo: document.getElementById("qrLogo").value.trim(),
    bottomText: document.getElementById("bottomText").value
  };
}

function saveCustomer(){
  const code = document.getElementById("id").value.trim();

  if(!code){
    alert("لا يوجد كود للعميل");
    return;
  }

  const data = {
    name: document.getElementById("name").value,
    description: document.getElementById("description").value,
    logo: document.getElementById("logo").value,
    whatsapp: document.getElementById("whatsapp").value,
    facebook: document.getElementById("facebook").value,
    instagram: document.getElementById("instagram").value,
    website: document.getElementById("website").value,
    payment: document.getElementById("payment").value,
    qrStyle: getQRStyleData()
  };

  db.ref("customers/" + code).set(data).then(function(){
    alert("تم حفظ العميل بنجاح ✅");
    loadCustomers();
    generateNumber();
  }).catch(function(error){
    alert(error.message);
  });
}

function deleteCustomer(){
  const id = document.getElementById("id").value.trim();

  if(!id){
    alert("اختر عميل أولاً");
    return;
  }

  if(confirm("هل تريد حذف " + id + " ؟")){
    db.ref("customers/" + id).remove().then(function(){
      alert("تم الحذف ✅");
      loadCustomers();
      generateNumber();

      document.getElementById("customerList").value = "";
      document.getElementById("searchId").value = "";
      document.getElementById("name").value = "";
      document.getElementById("description").value = "";
      document.getElementById("logo").value = "";
      document.getElementById("whatsapp").value = "";
      document.getElementById("facebook").value = "";
      document.getElementById("instagram").value = "";
      document.getElementById("website").value = "";
      document.getElementById("payment").value = "";
      document.getElementById("qrLogo").value = "";
      document.getElementById("bottomText").value = "";
      document.getElementById("qrcode").innerHTML = "";
      document.getElementById("qrLink").textContent = "";
      document.getElementById("bottomPreview").textContent = "";
      qrCode = null;
    }).catch(function(error){
      alert("تعذر الحذف: " + error.message);
    });
  }
}

function updateBottomPreview(){
  document.getElementById("bottomPreview").textContent =
    document.getElementById("bottomText").value;
}

function createQR(){
  const code = document.getElementById("id").value.trim();

  if(!code){
    alert("اختر أو أنشئ عميل أولاً");
    return;
  }

  const url =
    "https://mohamdsagrsy692-a11y.github.io/qr-system/qr.html?id=" + encodeURIComponent(code);

  document.getElementById("qrLink").textContent = url;
  document.getElementById("qrcode").innerHTML = "";

  const style = getQRStyleData();

  qrCode = new QRCodeStyling({
    width: 300,
    height: 300,
    data: url,
    image: style.qrLogo || undefined,
    imageOptions: {
      crossOrigin: "anonymous",
      margin: 8,
      imageSize: 0.22,
      hideBackgroundDots: true
    },
    dotsOptions: {
      color: style.dotColor,
      type: style.dotStyle
    },
    cornersSquareOptions: {
      color: style.cornerColor,
      type: style.cornerStyle
    },
    cornersDotOptions: {
      color: style.cornerColor,
      type: "dot"
    },
    backgroundOptions: {
      color: style.bgColor
    }
  });

  qrCode.append(document.getElementById("qrcode"));
  updateBottomPreview();
}

function downloadQR(){
  if(!qrCode){
    alert("أنشئ QR أولاً");
    return;
  }

  qrCode.download({
    name: "QR",
    extension: "png"
  });
}

function resetQRDesign(){
  document.getElementById("dotColor").value = "#000000";
  document.getElementById("dotStyle").value = "rounded";
  document.getElementById("cornerColor").value = "#000000";
  document.getElementById("cornerStyle").value = "square";
  document.getElementById("bgColor").value = "#ffffff";
  document.getElementById("qrLogo").value = "";
  document.getElementById("bottomText").value = "";
  updateBottomPreview();
}
</script>

</body>
</html>
