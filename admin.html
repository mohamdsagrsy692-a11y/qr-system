<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الـ QR</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <link rel="icon" type="image/png" href="assets/icon.png">

    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            padding: 20px;
            direction: rtl;
            padding-bottom: 90px;
        }

        /* PWA Install Button Style */
        #installButton {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: opacity 0.2s;
        }
        #installButton:hover {
            opacity: 0.9;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: none;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #edf2f7;
        }

        .header-bar h2 {
            margin: 0;
            color: #222;
        }

        .btn-logout {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .tabs-nav {
            display: flex;
            background: #edf2f7;
            border-radius: 8px;
            padding: 5px;
            margin-bottom: 20px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #111;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            padding: 12px 20px;
            display: none;
            justify-content: center;
            gap: 15px;
            z-index: 1000;
        }

        .sticky-footer .btn {
            max-width: 200px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        input[type="text"], input[type="password"], input[type="color"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
            transition: border-color 0.2s;
        }

        input[type="color"] {
            height: 42px;
            padding: 4px;
            cursor: pointer;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus {
            border-color: #3b82f6;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
            gap: 8px;
            margin-bottom: 15px;
        }

        .option-box {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .option-box:hover {
            border-color: #cbd5e0;
            background: #f8fafc;
        }

        .option-box.active {
            border-color: #3b82f6;
            background: #eff6ff;
            box-shadow: 0 0 0 1px #3b82f6;
        }

        .opt-preview-square { width: 22px; height: 22px; background: #2d3748; border-radius: 2px; }
        .opt-preview-dots { width: 22px; height: 22px; background: radial-gradient(circle, #2d3748 40%, transparent 45%); }
        .opt-preview-rounded { width: 22px; height: 22px; background: #2d3748; border-radius: 6px; }
        .opt-preview-extra-rounded { width: 22px; height: 22px; background: #2d3748; border-radius: 10px; }
        .opt-preview-classy { width: 22px; height: 22px; background: #2d3748; border-radius: 2px 10px 2px 10px; }
        .opt-preview-classy-rounded { width: 22px; height: 22px; background: #2d3748; border-radius: 6px 14px 6px 14px; }
        .opt-preview-dot-corner { width: 22px; height: 22px; background: #2d3748; border-radius: 50%; }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .btn-upload {
            background: #4A5568;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-save { background-color: #111; color: #fff; }
        .btn-delete { background-color: #c53030; color: #fff; }
        .btn-qr { background-color: #2d3748; color: #fff; }
        .btn-download { background-color: #111; color: #fff; margin-top: 10px; }

        .qr-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-align: center;
        }

        .qr-frame-wrapper {
            display: inline-block;
            padding: 15px;
            background: #ffffff;
            margin: 15px 0;
            transition: all 0.3s ease;
        }

        #qrContainer {
            display: flex;
            justify-content: center;
        }

        .qr-frame-text {
            margin-top: 8px;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
        }

        .download-box {
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            border: 1px solid #cbd5e0;
        }

        .qr-custom-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preview-logo {
            max-width: 80px;
            max-height: 80px;
            margin-top: 10px;
            border-radius: 8px;
            display: none;
            border: 1px solid #ddd;
        }

        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('assets/login-bg.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background: rgba(30, 35, 45, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 90%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            text-align: center;
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .login-body .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .login-body input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 45px 14px 15px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        .login-body input::placeholder {
            color: #94a3b8;
        }

        .login-body input:focus {
            border-color: #3b82f6;
            background: rgba(255, 255, 255, 0.12);
        }

        .login-body .input-icon-img {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            opacity: 0.8;
        }

        .toggle-password-img {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .toggle-password-img:hover {
            opacity: 1;
        }

        .btn-login-submit {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            text-align: center;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .custom-modal-box {
            background: #fff;
            width: 90%;
            max-width: 340px;
            padding: 25px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .custom-modal-msg {
            font-size: 16px;
            color: #2d3748;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.5;
        }

        .custom-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .custom-modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-modal-ok { background-color: #111; color: #fff; }
        .btn-modal-cancel { background-color: #e2e8f0; color: #4a5568; }
    </style>
</head>
<body>

<!-- PWA Install Button -->
<button id="installButton">📥 تثبيت التطبيق</button>

<div class="login-overlay" id="loginModal">
    <div class="login-card">
        <div class="login-header">
            <h2>تسجيل الدخول</h2>
            <p class="login-subtitle">مرحباً بك مجدداً، يرجى تسجيل الدخول إلى حسابك</p>
        </div>
        <div class="login-body">
            <div class="input-box">
                <input type="text" id="adminUsername" placeholder="اسم المستخدم" onkeypress="handleKeyPress(event)">
                <img src="assets/user-icon.png" class="input-icon-img" alt="مستخدم">
            </div>
            
            <div class="input-box">
                <input type="password" id="adminPassword" placeholder="كلمة المرور" onkeypress="handleKeyPress(event)">
                <img src="assets/eye-closed.png" id="toggleEyeIcon" class="toggle-password-img" alt="إظهار/إخفاء" onclick="togglePasswordVisibility()">
            </div>
            
            <p class="error-msg" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة!</p>

            <button class="btn-login-submit" onclick="checkLogin()">دخول</button>
        </div>
    </div>
</div>

<div class="custom-modal-overlay" id="customModal">
    <div class="custom-modal-box">
        <div class="custom-modal-msg" id="customModalMsg">رسالة التنبيه هنا</div>
        <div class="custom-modal-buttons" id="customModalButtons">
            <button class="custom-modal-btn btn-modal-ok" id="modalOkBtn">حسناً</button>
        </div>
    </div>
</div>

<div class="container" id="adminContainer">
    <div class="header-bar">
        <h2><i class="fa-solid fa-qrcode ml-2"></i> إدارة العملاء والـ QR</h2>
        <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
    </div>

    <!-- شريط التبويبات -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('tab-profile')"><i class="fa-solid fa-user-pen"></i> 1. بيانات العميل</button>
        <button class="tab-btn" onclick="switchTab('tab-contacts')"><i class="fa-solid fa-address-book"></i> 2. التواصل والروابط</button>
        <button class="tab-btn" onclick="switchTab('tab-qr')"><i class="fa-solid fa-wand-magic-sparkles"></i> 3. تصميم وتوليد الـ QR</button>
    </div>

    <!-- التبويب الأول: بيانات العميل -->
    <div id="tab-profile" class="tab-content active">
        <div class="grid-2" style="margin-bottom: 15px;">
            <div class="form-group" style="margin-bottom:0;">
                <label><i class="fa-solid fa-users"></i> اختيار عميل سابق</label>
                <select id="customerSelect" onchange="loadSelectedCustomer()">
                    <option value="">اختر العميل</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom:0;">
                <label><i class="fa-solid fa-magnifying-glass"></i> أو بحث بكود العميل</label>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="searchCode" placeholder="أدخل الكود...">
                    <button class="btn btn-save" style="margin-top:0; width: auto; padding: 0 15px;" onclick="searchCustomerByCode()"><i class="fa-solid fa-search"></i> بحث</button>
                </div>
            </div>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <div class="form-group">
            <label><i class="fa-solid fa-fingerprint"></i> كود العميل (فريد وغير قابل للتكرار)</label>
            <input type="text" id="code" readonly style="background-color: #edf2f7; font-weight: bold; color: #2d3748;">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-link"></i> رابط تحويل مباشر (اختياري)</label>
            <input type="text" id="redirectUrl" placeholder="https://g.page/r/... (اتركه فارغاً لفتح الكارت الشخصي)">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-building"></i> اسم النشاط</label>
            <input type="text" id="name" placeholder="اسم العميل أو الشركة">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-align-right"></i> وصف النشاط</label>
            <textarea id="description" rows="2" placeholder="نبذة مختصرة عن الخدمات"></textarea>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-image"></i> صورة اللوجو الأساسية للنشاط</label>
            <div class="file-input-wrapper">
                <input type="text" id="logo" placeholder="رابط الصورة أو اختر من المعرض" onchange="updateQRLive()">
                <label class="btn-upload" for="logoFileInput"><i class="fa-solid fa-upload"></i> اختر صورة</label>
                <input type="file" id="logoFileInput" accept="image/*" onchange="handleMainLogoUpload(this)">
            </div>
            <img id="logoPreview" class="preview-logo" alt="معاينة اللوجو">
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-copyright"></i> الحقوق (الفوتر)</label>
            <input type="text" id="footer" placeholder="اتركها فارغة لظهور: جميع الحقوق محفوظة ✓">
        </div>
    </div>

    <!-- التبويب الثاني: التواصل والروابط -->
    <div id="tab-contacts" class="tab-content">
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-solid fa-phone"></i> رقم الهاتف / الاتصال</label><input type="text" id="phone" placeholder="01xxxxxxxxx"></div>
            <div class="form-group"><label><i class="fa-brands fa-whatsapp"></i> واتساب (WhatsApp)</label><input type="text" id="whatsapp" placeholder="رقم الواتساب"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-brands fa-telegram"></i> تليجرام (Telegram)</label><input type="text" id="telegram" placeholder="معرف تليجرام"></div>
            <div class="form-group"><label><i class="fa-brands fa-facebook-messenger"></i> مسنجر (Messenger)</label><input type="text" id="messenger" placeholder="رابط المسنجر"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-brands fa-facebook"></i> فيسبوك (Facebook)</label><input type="text" id="facebook" placeholder="رابط صفحة الفيسبوك"></div>
            <div class="form-group"><label><i class="fa-brands fa-instagram"></i> انستجرام (Instagram)</label><input type="text" id="instagram" placeholder="رابط الانستجرام"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-brands fa-tiktok"></i> تيك توك (TikTok)</label><input type="text" id="tiktok" placeholder="رابط التيك توك"></div>
            <div class="form-group"><label><i class="fa-brands fa-snapchat"></i> سناب شات (Snapchat)</label><input type="text" id="snapchat" placeholder="حساب السناب شات"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-brands fa-pinterest"></i> بنترست (Pinterest)</label><input type="text" id="pinterest" placeholder="رابط بنترست"></div>
            <div class="form-group"><label><i class="fa-brands fa-youtube"></i> يوتيوب (YouTube)</label><input type="text" id="youtube" placeholder="رابط القناة"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-brands fa-linkedin"></i> لينكد إن (LinkedIn)</label><input type="text" id="linkedin" placeholder="رابط لينكد إن"></div>
            <div class="form-group"><label><i class="fa-solid fa-globe"></i> الموقع الإلكتروني (Website)</label><input type="text" id="website" placeholder="https://..."></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-solid fa-book-open"></i> الكتالوج (Catalog)</label><input type="text" id="catalog" placeholder="رابط الكتالوج"></div>
            <div class="form-group"><label><i class="fa-solid fa-envelope"></i> البريد الإلكتروني (Gmail)</label><input type="text" id="gmail" placeholder="name@gmail.com"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-solid fa-location-dot"></i> الموقع الجغرافي (Location)</label><input type="text" id="location" placeholder="رابط خرائط جوجل"></div>
            <div class="form-group"><label><i class="fa-solid fa-star"></i> المراجعات (Review)</label><input type="text" id="review" placeholder="رابط تقييم جوجل"></div>
        </div>
        <div class="grid-2">
            <div class="form-group"><label><i class="fa-solid fa-wallet"></i> InstaPay</label><input type="text" id="instapay" placeholder="اسم الحساب / العنوان"></div>
            <div class="form-group"><label><i class="fa-solid fa-money-bill-transfer"></i> Cash</label><input type="text" id="vodafonecash" placeholder="رقم المحفظة"></div>
        </div>
    </div>

    <!-- التبويب الثالث: تصميم وتوليد الـ QR -->
    <div id="tab-qr" class="tab-content">
        <div class="qr-section" id="qrSection">
            <h3 style="font-size:18px; margin-bottom:5px;"><i class="fa-solid fa-eye"></i> معاينة الـ QR</h3>
            
            <div id="qrFrameWrapper" class="qr-frame-wrapper" style="border: 3px solid #000000; border-radius: 10px;">
                <div id="qrContainer"></div>
                <div id="qrFrameText" class="qr-frame-text" style="color: #000000; display: none;">SCAN ME</div>
            </div>

            <div class="download-box">
                <div class="grid-2">
                    <div class="form-group" style="margin-bottom:5px;">
                        <label style="text-align:right;"><i class="fa-solid fa-file-arrow-down"></i> صيغة الحفظ</label>
                        <select id="downloadFormat">
                            <option value="png" selected>PNG (صورة عالية الوضوح)</option>
                            <option value="jpeg">JPEG / JPG</option>
                            <option value="svg">SVG (فيكتور للطباعة/الفيبر)</option>
                            <option value="webp">WEBP</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:5px;">
                        <label style="text-align:right;"><i class="fa-solid fa-expand"></i> أبعاد المقاس (Size)</label>
                        <select id="downloadSize">
                            <option value="300">300x300 px</option>
                            <option value="1000" selected>1000x1000 px (قياسي للطباعة)</option>
                            <option value="2000">2000x2000 px (HQ)</option>

                        </select>
                    </div>
                </div>
                <button class="btn btn-download" onclick="downloadQR()"><i class="fa-solid fa-download"></i> تحميل ملف الـ QR</button>
            </div>
        </div>

        <div class="qr-custom-box">
            <h3 style="font-size:16px; text-align:right; margin-bottom:12px;"><i class="fa-solid fa-palette"></i> إعدادات التخصيص والمظهر المتقدمة</h3>
            
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fa-regular fa-square"></i> شكل الإطار الخارجي (Frame)</label>
                    <select id="qrFrameStyle" onchange="updateQRLive()">

                        <option value="square">إطار مربع بزوايا حادة</option>

                <div class="form-group">
                    <label><i class="fa-solid fa-droplet"></i> لون الإطار والنص</label>
                    <input type="color" id="qrFrameColor" value="#000000" oninput="updateQRLive()">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-font"></i> نص العبارة داخل الإطار</label>
                <input type="text" id="qrFramePhrase" value="SCAN ME" placeholder="مثال: SCAN ME" oninput="updateQRLive()">
            </div>

            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fa-solid fa-paint-brush"></i> لون نقاط الـ QR</label>
                    <input type="color" id="qrDotColor" value="#000000" oninput="updateQRLive()">
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-fill-drip"></i> لون خلفية الـ QR</label>
                    <input type="color" id="qrBgColor" value="#ffffff" oninput="updateQRLive()">
                </div>
            </div>

            <!-- شكل نقاط الـ QR -->
            <div class="form-group">
                <label><i class="fa-solid fa-shapes"></i> شكل نقاط الـ QR (Dots Style)</label>
                <input type="hidden" id="qrDotType" value="square">
                <div class="options-grid">
                    <div class="option-box active" onclick="selectOption('qrDotType', 'square', this)" title="مربعات أساسية"><div class="opt-preview-square"></div></div>
                    <div class="option-box" onclick="selectOption('qrDotType', 'dots', this)" title="نقاط دائرية"><div class="opt-preview-dots"></div></div>
                    <div class="option-box" onclick="selectOption('qrDotType', 'rounded', this)" title="انحناء ناعم"><div class="opt-preview-rounded"></div></div>
                    <div class="option-box" onclick="selectOption('qrDotType', 'extra-rounded', this)" title="انحناء إضافي"><div class="opt-preview-extra-rounded"></div></div>
                    <div class="option-box" onclick="selectOption('qrDotType', 'classy', this)" title="كلاسيكي"><div class="opt-preview-classy"></div></div>
                    <div class="option-box" onclick="selectOption('qrDotType', 'classy-rounded', this)" title="كلاسيكي دائري"><div class="opt-preview-classy-rounded"></div></div>
                </div>
            </div>

            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <!-- إطار الزوايا -->
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fa-solid fa-border-all"></i> شكل إطار الزوايا (Marker border)</label>
                    <input type="hidden" id="qrCornerType" value="square">
                    <div class="options-grid">
                        <div class="option-box active" onclick="selectOption('qrCornerType', 'square', this)" title="مربع"><div class="opt-preview-square"></div></div>
                        <div class="option-box" onclick="selectOption('qrCornerType', 'dot', this)" title="دائري"><div class="opt-preview-dot-corner"></div></div>
                        <div class="option-box" onclick="selectOption('qrCornerType', 'extra-rounded', this)" title="انحناء ناعم"><div class="opt-preview-rounded"></div></div>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-palette"></i> لون إطار الزوايا</label>
                    <input type="color" id="qrCornerColor" value="#000000" oninput="updateQRLive()">
                </div>
            </div>

            <!-- مركز الزوايا -->
            <div class="grid-2">
                <div class="form-group">
                    <label><i class="fa-solid fa-bullseye"></i> شكل مركز الزوايا (Marker center)</label>
                    <input type="hidden" id="qrCornerDotType" value="square">
                    <div class="options-grid">
                        <div class="option-box active" onclick="selectOption('qrCornerDotType', 'square', this)" title="مربع"><div class="opt-preview-square"></div></div>
                        <div class="option-box" onclick="selectOption('qrCornerDotType', 'dot', this)" title="دائري"><div class="opt-preview-dot-corner"></div></div>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fa-solid fa-palette"></i> لون مركز الزوايا</label>
                    <input type="color" id="qrCornerDotColor" value="#000000" oninput="updateQRLive()">
                </div>

            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="form-group">
                <label><i class="fa-solid fa-file-image"></i> صورة اللوجو وسط الـ QR (اختياري)</label>
                <div class="file-input-wrapper">
                    <input type="text" id="qrCustomLogo" placeholder="" onchange="updateQRLive()">
                    <label class="btn-upload" for="qrLogoFileInput"><i class="fa-solid fa-folder-open"></i> من المعرض</label>
                    <input type="file" id="qrLogoFileInput" accept="image/*" onchange="handleQRLogoUpload(this)">
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-circle-question"></i> إظهار اللوجو وسط الـ QR؟</label>
                <select id="qrEmbedLogo" onchange="updateQRLive()">
                    <option value="yes" selected>نعم</option>
                    <option value="no">لا</option>
                </select>
            </div>
        </div>
    </div>

</div>

<!-- شريط الأزرار الثابت في أسفل الشاشة -->
<div class="sticky-footer" id="stickyFooter">
    <button class="btn btn-save" onclick="saveCustomer()"><i class="fa-solid fa-floppy-disk"></i> حفظ العميل</button>
    <button class="btn btn-qr" onclick="generateQR()"><i class="fa-solid fa-arrows-rotate"></i> توليد / تحديث QR</button>
    <button class="btn btn-delete" onclick="deleteCustomer()"><i class="fa-solid fa-trash-can"></i> حذف العميل</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
    // تفعيل الـ Service Worker لتشغيل الموقع كتطبيق PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
        });
    }

    // منطق زر التثبيت اليدوي (PWA Install Prompt)
    let deferredPrompt;
    const installBtn = document.getElementById('installButton');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (installBtn) installBtn.style.display = 'block';
    });

    if (installBtn) {
        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                });
            }
        });
    }

    const ADMIN_USERNAME = "abdallah.haroun";
    const ADMIN_PASSWORD = "CODE010951";

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function selectOption(hiddenInputId, value, element) {
        document.getElementById(hiddenInputId).value = value;
        const parentGrid = element.parentElement;
        parentGrid.querySelectorAll('.option-box').forEach(box => box.classList.remove('active'));
        element.classList.add('active');
        updateQRLive();
    }

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById("adminPassword");
        const toggleIcon = document.getElementById("toggleEyeIcon");
        
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.src = "assets/eye-open.png";
        } else {
            passwordInput.type = "password";
            toggleIcon.src = "assets/eye-closed.png";
        }
    }

    function showCustomAlert(message, callback) {
        const modal = document.getElementById("customModal");
        const msgEl = document.getElementById("customModalMsg");
        const buttonsEl = document.getElementById("customModalButtons");

        msgEl.textContent = message;
        buttonsEl.innerHTML = '<button class="custom-modal-btn btn-modal-ok" id="modalOkBtn">حسناً</button>';
        modal.style.display = "flex";

        document.getElementById("modalOkBtn").onclick = function() {
            modal.style.display = "none";
            if (callback) callback();
        };
    }

    function showCustomConfirm(message, onConfirm) {
        const modal = document.getElementById("customModal");
        const msgEl = document.getElementById("customModalMsg");
        const buttonsEl = document.getElementById("customModalButtons");

        msgEl.textContent = message;
        buttonsEl.innerHTML = `
            <button class="custom-modal-btn btn-modal-cancel" id="modalCancelBtn">إلغاء</button>
            <button class="custom-modal-btn btn-modal-ok" style="background-color: #c53030;" id="modalConfirmBtn">تأكيد الحذف</button>
        `;
        modal.style.display = "flex";

        document.getElementById("modalCancelBtn").onclick = function() {
            modal.style.display = "none";
        };

        document.getElementById("modalConfirmBtn").onclick = function() {
            modal.style.display = "none";
            if (onConfirm) onConfirm();
        };
    }

    window.onload = function() {
        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("adminContainer").style.display = "block";
            document.getElementById("stickyFooter").style.display = "flex";
            loadCustomerList();
            generateNextCustomerCode();
        }
    };

    function checkLogin() {
        const inputUser = document.getElementById("adminUsername").value.trim();
        const inputPass = document.getElementById("adminPassword").value.trim();
        const errorMsg = document.getElementById("loginError");

        if (inputUser === ADMIN_USERNAME && inputPass === ADMIN_PASSWORD) {
            sessionStorage.setItem("adminLoggedIn", "true");
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("adminContainer").style.display = "block";
            document.getElementById("stickyFooter").style.display = "flex";
            errorMsg.style.display = "none";
            loadCustomerList();
            generateNextCustomerCode();
        } else {
            errorMsg.style.display = "block";
        }
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") {
            checkLogin();
        }
    }

    function logout() {
        sessionStorage.removeItem("adminLoggedIn");
        location.reload();
    }

    const firebaseConfig = {
        apiKey: "AIzaDAXHBPfJUr2quRe_8OyhEDqGrHaneNmcc",
        authDomain: "qr-system-45702.firebaseapp.com",
        databaseURL: "https://qr-system-45702-default-rtdb.firebaseio.com",
        projectId: "qr-system-45702",
        storageBucket: "qr-system-45702.firebasestorage.app",
        messagingSenderId: "983573164670",
        appId: "1:983573164670:web:4b352977dd6085b0649e2f"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let qrCodeInstance = null;

    function SafeSetValue(id, val) {
        const el = document.getElementById(id);
        if (el) el.value = val || "";
    }

    function SafeGetValue(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
    }

    function generateNextCustomerCode() {
        db.ref("customers").once("value").then(snapshot => {
            const data = snapshot.val();
            let maxSeq = 0;

            if (data) {
                Object.keys(data).forEach(key => {
                    if (key.length >= 5) {
                        const lastFive = key.slice(-5);
                        const num = parseInt(lastFive, 10);
                        if (!isNaN(num) && num > maxSeq) {
                            maxSeq = num;
                        }
                    }
                });
            }

            const nextSeq = maxSeq + 1;
            const prefixCode = "CODE:0458456"; 
            const nextCode = prefixCode + String(nextSeq).padStart(5, "0");
            
            SafeSetValue("code", nextCode);
        }).catch(err => {
            SafeSetValue("code", "CODE:045845600001");
        });
    }

    function handleMainLogoUpload(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                SafeSetValue("logo", e.target.result);
                const preview = document.getElementById("logoPreview");
                if (preview) {
                    preview.src = e.target.result;
                    preview.style.display = "block";
                }
                updateQRLive();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function handleQRLogoUpload(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                SafeSetValue("qrCustomLogo", e.target.result);
                updateQRLive();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function loadCustomerList() {
        db.ref("customers").on("value", function(snapshot) {
            const select = document.getElementById("customerSelect");
            select.innerHTML = '<option value="">اختر العميل</option>';
            snapshot.forEach(function(child) {
                const data = child.val();
                const option = document.createElement("option");
                option.value = child.key;
                option.textContent = (data.name || "بدون اسم") + " (" + child.key + ")";
                select.appendChild(option);
            });
        });
    }

    function loadSelectedCustomer() {
        const id = SafeGetValue("customerSelect");
        if (!id) return;

        db.ref("customers/" + id).once("value").then(function(snapshot) {
            const data = snapshot.val();
            if (data) {
                populateForm(id, data);
            }
        });
    }

    function searchCustomerByCode() {
        const code = SafeGetValue("searchCode");
        if (!code) {
            showCustomAlert("يرجى إدخال كود العميل للبحث");
            return;
        }

        db.ref("customers/" + code).once("value").then(function(snapshot) {
            const data = snapshot.val();
            if (data) {
                populateForm(code, data);
            } else {
                showCustomAlert("لم يتم العثور على عميل بهذا الكود");
            }
        });
    }

    function populateForm(id, data) {
        SafeSetValue("code", id);
        SafeSetValue("redirectUrl", data.redirectUrl);
        SafeSetValue("name", data.name);
        SafeSetValue("description", data.description);
        SafeSetValue("logo", data.logo);
        SafeSetValue("phone", data.phone);
        SafeSetValue("whatsapp", data.whatsapp);
        SafeSetValue("telegram", data.telegram);
        SafeSetValue("messenger", data.messenger);
        SafeSetValue("facebook", data.facebook);
        SafeSetValue("instagram", data.instagram);
        SafeSetValue("tiktok", data.tiktok);
        SafeSetValue("snapchat", data.snapchat);
        SafeSetValue("pinterest", data.pinterest);
        SafeSetValue("youtube", data.youtube);
        SafeSetValue("linkedin", data.linkedin);
        SafeSetValue("website", data.website);
        SafeSetValue("catalog", data.catalog);
        SafeSetValue("gmail", data.gmail);
        SafeSetValue("location", data.location);
        SafeSetValue("review", data.review);
        SafeSetValue("instapay", data.instapay);
        SafeSetValue("vodafonecash", data.vodafonecash);
        SafeSetValue("footer", data.footer);

        const preview = document.getElementById("logoPreview");
        if (data.logo && preview) {
            preview.src = data.logo;
            preview.style.display = "block";
        } else if (preview) {
            preview.style.display = "none";
        }

        generateQR();
    }

    function saveCustomer() {
        const code = SafeGetValue("code");
        if (!code) {
            showCustomAlert("كود العميل غير موجود");
            return;
        }

        const customerData = {
            redirectUrl: SafeGetValue("redirectUrl"),
            name: SafeGetValue("name"),
            description: SafeGetValue("description"),
            logo: SafeGetValue("logo"),
            phone: SafeGetValue("phone"),
            whatsapp: SafeGetValue("whatsapp"),
            telegram: SafeGetValue("telegram"),
            messenger: SafeGetValue("messenger"),
            facebook: SafeGetValue("facebook"),
            instagram: SafeGetValue("instagram"),
            tiktok: SafeGetValue("tiktok"),
            snapchat: SafeGetValue("snapchat"),
            pinterest: SafeGetValue("pinterest"),
            youtube: SafeGetValue("youtube"),
            linkedin: SafeGetValue("linkedin"),
            website: SafeGetValue("website"),
            catalog: SafeGetValue("catalog"),
            gmail: SafeGetValue("gmail"),
            location: SafeGetValue("location"),
            review: SafeGetValue("review"),
            instapay: SafeGetValue("instapay"),
            vodafonecash: SafeGetValue("vodafonecash"),
            footer: SafeGetValue("footer")
        };

        db.ref("customers/" + code).set(customerData)
            .then(function() {
                showCustomAlert("تم حفظ بيانات العميل بنجاح!", function() {
                    clearForm();
                });
            })
            .catch(function(error) {
                showCustomAlert("خطأ أثناء الحفظ: " + error.message);
            });
    }

    function deleteCustomer() {
        const code = SafeGetValue("code");
        if (!code) {
            showCustomAlert("يرجى تحديد كود العميل للحذف");
            return;
        }

        showCustomConfirm("هل أنت متأكد من حذف هذا العميل نهائياً؟", function() {
            db.ref("customers/" + code).remove()
                .then(function() {
                    showCustomAlert("تم حذف العميل بنجاح", function() {
                        clearForm();
                    });
                })
                .catch(function(error) {
                    showCustomAlert("خطأ أثناء الحذف: " + error.message);
                });
        });
    }

    function clearForm() {
        SafeSetValue("searchCode", "");
        SafeSetValue("redirectUrl", "");
        SafeSetValue("name", "");
        SafeSetValue("description", "");
        SafeSetValue("logo", "");
        SafeSetValue("phone", "");
        SafeSetValue("qrCustomLogo", "");
        SafeSetValue("whatsapp", "");
        SafeSetValue("telegram", "");
        SafeSetValue("messenger", "");
        SafeSetValue("facebook", "");
        SafeSetValue("instagram", "");
        SafeSetValue("tiktok", "");
        SafeSetValue("snapchat", "");
        SafeSetValue("pinterest", "");
        SafeSetValue("youtube", "");
        SafeSetValue("linkedin", "");
        SafeSetValue("website", "");
        SafeSetValue("catalog", "");
        SafeSetValue("gmail", "");
        SafeSetValue("location", "");
        SafeSetValue("review", "");
        SafeSetValue("instapay", "");
        SafeSetValue("vodafonecash", "");
        SafeSetValue("footer", "");
        document.getElementById("customerSelect").value = "";
        const preview = document.getElementById("logoPreview");
        if (preview) preview.style.display = "none";
        
        generateNextCustomerCode();
    }

    function updateQRLive() {
        const code = SafeGetValue("code");
        if (code) {
            generateQR();
        }
    }

    function generateQR() {
        const code = SafeGetValue("code");
        if (!code) return;

        const qrContainer = document.getElementById("qrContainer");
        qrContainer.innerHTML = "";

        const targetURL = window.location.origin + window.location.pathname.replace("admin.html", "qr.html") + "?id=" + encodeURIComponent(code);

        const dotColor = SafeGetValue("qrDotColor") || "#000000";
        const bgColor = SafeGetValue("qrBgColor") || "#ffffff";
        const dotType = SafeGetValue("qrDotType") || "square";
        
        const cornerType = SafeGetValue("qrCornerType") || "square";
        const cornerColor = SafeGetValue("qrCornerColor") || dotColor;
        
        const cornerDotType = SafeGetValue("qrCornerDotType") || "square";
        const cornerDotColor = SafeGetValue("qrCornerDotColor") || dotColor;

        const embedLogo = SafeGetValue("qrEmbedLogo");
        const finalLogo = SafeGetValue("qrCustomLogo") || SafeGetValue("logo");

        const frameStyle = SafeGetValue("qrFrameStyle") || "none";
        const frameColor = SafeGetValue("qrFrameColor") || "#000000";
        const framePhrase = SafeGetValue("qrFramePhrase") || "SCAN ME";

        const frameWrapper = document.getElementById("qrFrameWrapper");
        const frameTextEl = document.getElementById("qrFrameText");

        if (frameStyle === "none") {
            frameWrapper.style.border = "none";
            frameWrapper.style.borderRadius = "0px";
            frameTextEl.style.display = "none";
        } else {
            frameWrapper.style.border = "4px solid " + frameColor;
            if (frameStyle === "square") {
                frameWrapper.style.borderRadius = "4px";
            } else if (frameStyle === "rounded") {
                frameWrapper.style.borderRadius = "12px";
            } else if (frameStyle === "pill") {
                frameWrapper.style.borderRadius = "24px";
            }
            
            if (framePhrase.trim() !== "") {
                frameTextEl.textContent = framePhrase;
                frameTextEl.style.color = frameColor;
                frameTextEl.style.display = "block";
            } else {
                frameTextEl.style.display = "none";
            }
        }

        const qrConfig = {
            width: 260,
            height: 260,
            type: "canvas",
            data: targetURL,
            dotsOptions: { color: dotColor, type: dotType },
            backgroundOptions: { color: bgColor },
            cornersSquareOptions: { type: cornerType, color: cornerColor },
            cornersDotOptions: { type: cornerDotType, color: cornerDotColor },
            imageOptions: { crossOrigin: "anonymous", margin: 4, imageSize: 0.26 }
        };

        if (embedLogo === "yes" && finalLogo) {
            qrConfig.image = finalLogo;
        }

        qrCodeInstance = new QRCodeStyling(qrConfig);
        qrCodeInstance.append(qrContainer);
    }

    function downloadQR() {
        const code = SafeGetValue("code") || "QR_Code";
        const selectedFormat = SafeGetValue("downloadFormat") || "png";
        const selectedSize = parseInt(SafeGetValue("downloadSize")) || 1000;

        if (qrCodeInstance) {
            qrCodeInstance.download({
                name: code,
                extension: selectedFormat
            });
        } else {
            showCustomAlert("يرجى توليد الـ QR أولاً قبل التحميل");
        }
    }
</script>
</body>
</html>
