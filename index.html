<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الورشة | Alwarsha</title>
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* خلفية متدرجة أساسية */
            background: linear-gradient(135deg, #0b2239 0%, #116888 50%, #1583a3 100%);
            
            /* لو حابب تستخدم صورة background.jpg من الفولدر الجديد فك التعليق عن السطر الجاي: */
            /* background: url('assets/background.jpg') no-repeat center center fixed; background-size: cover; */
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 15px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background-color: #fff;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .title {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.88);
            
            /* لو حابب تستخدم صورة card-bg.jpg من الفولدر الجديد فك التعليق عن السطر الجاي: */
            /* background: url('assets/card-bg.jpg') rgba(255, 255, 255, 0.85); background-size: cover; */
            
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: #000;
            font-weight: bold;
            font-size: 1.15rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            height: 60px;
        }

        .btn-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .btn-text {
            flex-grow: 1;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .phone-num {
            direction: ltr;
            font-size: 1.25rem;
            letter-spacing: 1px;
        }

        .icon {
            font-size: 1.8rem;
            width: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-img {
            width: 65px;
            height: auto;
            object-fit: contain;
        }

        .fa-phone { color: #2563eb; }
        .fa-whatsapp { color: #25d366; }
        .fa-facebook { color: #1877f2; }
        .fa-instagram { color: #e4405f; }

        .footer {
            margin-top: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- اللوجو (المسار الجديد) -->
        <div class="logo-container">
            <img class="logo" src="assets/logo.png" alt="Alwarsha Logo" onerror="this.src='https://via.placeholder.com/130'">
        </div>

        <h1 class="title">الورشة</h1>
        <div class="subtitle">Alwarsha</div>

        <div class="btn-list">
            
            <!-- اتصال -->
            <a href="tel:01095195829" class="btn-card">
                <span class="btn-text phone-num">01095195829</span>
                <span class="icon"><i class="fa-solid fa-phone"></i></span>
            </a>

            <!-- واتساب -->
            <a href="https://wa.me/201095195829" target="_blank" class="btn-card">
                <span class="btn-text">WhatsApp</span>
                <span class="icon"><i class="fa-brands fa-whatsapp"></i></span>
            </a>

            <!-- فيسبوك -->
            <a href="#" target="_blank" class="btn-card">
                <span class="btn-text">Facebook</span>
                <span class="icon"><i class="fa-brands fa-facebook"></i></span>
            </a>

            <!-- إنستجرام -->
            <a href="#" target="_blank" class="btn-card">
                <span class="btn-text">Instagram</span>
                <span class="icon"><i class="fa-brands fa-instagram"></i></span>
            </a>

            <!-- انستا باي (المسار الجديد) -->
            <a href="#" class="btn-card">
                <span class="btn-text">InstaPay</span>
                <span class="icon">
                    <img src="assets/instapay.png" alt="InstaPay" class="icon-img" onerror="this.style.display='none'">
                </span>
            </a>

            <!-- فودافون كاش (المسار الجديد) -->
            <a href="#" class="btn-card">
                <span class="btn-text">Vodafone Cash</span>
                <span class="icon">
                    <img src="assets/vodafonecash.png" alt="Vodafone Cash" class="icon-img" onerror="this.style.display='none'">
                </span>
            </a>

        </div>

        <div class="footer">
            Alwarsha ©
        </div>
    </div>

</body>
</html>
