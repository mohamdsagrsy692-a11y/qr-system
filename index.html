<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسم النشاط التجاري</title>
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 30px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #f0f0f0;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.4rem;
            color: #222;
            margin-bottom: 6px;
        }

        .bio {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 24px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            background: #181818;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
            background: #333333;
        }

        .btn i {
            font-size: 1.1rem;
        }

        /* تخصيص اختياري لألوان الأزرار عند التأشير */
        .btn.whatsapp:hover { background: #25D366; }
        .btn.facebook:hover { background: #1877F2; }
        .btn.instagram:hover { background: #E4405F; }
    </style>
</head>

<body>

    <div class="card">
        <img class="logo" src="https://via.placeholder.com/100" alt="شعار النشاط">

        <h1>اسم النشاط</h1>
        <p class="bio">كل روابطنا ومعلومات التواصل في مكان واحد</p>

        <div class="links-container">
            <a class="btn whatsapp" href="#" target="_blank">
                <i class="fa-brands fa-whatsapp"></i> واتساب
            </a>

            <a class="btn facebook" href="#" target="_blank">
                <i class="fa-brands fa-facebook-f"></i> فيسبوك
            </a>

            <a class="btn instagram" href="#" target="_blank">
                <i class="fa-brands fa-instagram"></i> إنستجرام
            </a>

            <a class="btn" href="#" target="_blank">
                <i class="fa-solid fa-globe"></i> الموقع الإلكتروني
            </a>

            <a class="btn" href="#" target="_blank">
                <i class="fa-solid fa-credit-card"></i> طرق الدفع
            </a>
        </div>
    </div>

</body>
</html>
